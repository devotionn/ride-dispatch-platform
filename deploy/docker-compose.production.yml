# Production stack: MySQL 8.4 + Spring Boot backend + Nginx (frontends baked in).
#
# Usage:
#   cp deploy/production/.env.example deploy/production/.env   # then edit it
#   docker compose -f deploy/docker-compose.production.yml \
#     --env-file deploy/production/.env up -d --build
#
# Or use deploy/scripts/deploy.sh. See docs/10-production/ for runbooks.

services:
  mysql:
    image: mysql:8.4
    container_name: ride-dispatch-mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 3306 deliberately stays inside the compose network. For manual access use
    # `docker compose exec mysql mysql -u<user> -p<db>`; never publish this port.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ../server
    image: ${BACKEND_IMAGE:-ride-dispatch-backend:local}
    container_name: ride-dispatch-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      BRAND_LOGO_UPLOAD_DIR: /app/data/brand
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      JAVA_TOOL_OPTIONS: ${JVM_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - brand-data:/app/data/brand
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    # Spring graceful shutdown waits up to 30s; give SIGTERM room to complete.
    stop_grace_period: 40s
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    # No published ports: the backend is only reachable through nginx on the
    # internal compose network.

  nginx:
    build:
      context: ..
      dockerfile: deploy/production/nginx/Dockerfile
    image: ${NGINX_IMAGE:-ride-dispatch-nginx:local}
    container_name: ride-dispatch-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${ADMIN_HTTPS_PORT:-8443}:8443'
    volumes:
      # TLS certificates live on the host; see docs/10-production/https-and-domain-setup.md
      - ./production/certs:/etc/nginx/certs:ro

volumes:
  mysql-data:
  brand-data:
