spring:
  datasource:
    # Production always targets MySQL. DB_PASSWORD has no default on purpose:
    # a missing credential must fail startup instead of falling back to H2.
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:ride_dispatch}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Swagger/OpenAPI is a development aid and must not be reachable in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  bootstrap-admin:
    # First-run account creation only happens when admin_user is empty.
    # Rotate this password right after first login and clear it from the env file.
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  brand:
    # No default: production must explicitly point at the persistent volume path.
    logo-upload-dir: ${BRAND_LOGO_UPLOAD_DIR}
