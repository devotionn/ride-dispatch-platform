spring:
  application:
    name: ride-dispatch-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ride_dispatch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:ride}
    # Production/staging must provide DB_PASSWORD; the local profile uses H2.
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  brand:
    logo-upload-dir: ${BRAND_LOGO_UPLOAD_DIR:./data/brand}
